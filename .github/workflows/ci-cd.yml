name: 🚀 CI/CD Portfolio

on:
  push:
    branches:
      - master
      - main
      - qa

env:
  VERSION: "2.0"
  PROJECT_TAG: "port-gcp"

jobs:
  # 🧩 Build Frontend
  build_frontend:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: 🏗️ Build Frontend
        run: docker build -t vsantosmt/portfolio-frontend:${{ env.VERSION }} ./frontend

  # 🧩 Build Backend
  build_backend:
    runs-on: [self-hosted, Linux, X64]
    needs: build_frontend
    steps:
      - uses: actions/checkout@v4
      - name: 🏗️ Build Backend
        run: docker build -t vsantosmt/portfolio-backend:${{ env.VERSION }} ./backend

  # 🧩 Build Nginx
  build_nginx:
    runs-on: [self-hosted, Linux, X64]
    needs: build_backend
    steps:
      - uses: actions/checkout@v4
      - name: 🏗️ Build Nginx
        run: docker build -t vsantosmt/portfolio-nginx:${{ env.VERSION }} ./nginx

  # 🐳 Push Images to Docker Hub
  push_image:
    runs-on: [self-hosted, Linux, X64]
    needs: [build_frontend, build_backend, build_nginx]
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: 📤 Push Images
        run: |
          docker push vsantosmt/portfolio-frontend:${{ env.VERSION }}
          docker push vsantosmt/portfolio-backend:${{ env.VERSION }}
          docker push vsantosmt/portfolio-nginx:${{ env.VERSION }}

  # 🚀 Deploy Containers
  execute_container:
    runs-on: [self-hosted, Linux, X64]
    needs: push_image
    steps:
      - uses: actions/checkout@v4

      - name: 🧱 Ensure Docker network exists
        run: |
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

      - name: 📥 Pull latest images
        run: |
          docker pull vsantosmt/portfolio-frontend:${{ env.VERSION }}
          docker pull vsantosmt/portfolio-backend:${{ env.VERSION }}
          docker pull vsantosmt/portfolio-nginx:${{ env.VERSION }}

      - name: 🧹 Remove old containers
        run: |
          chmod +x script/remove_container.sh
          ./script/remove_container.sh

      - name: 🏗️ Prepare frontend files
        run: |
          # Limpa diretório anterior se existir
          sudo rm -rf /tmp/frontend-dist
          mkdir -p /tmp/frontend-dist

          # Cria container temporário do frontend apenas para extrair arquivos
          docker create --name webserver-frontend-temp vsantosmt/portfolio-frontend:${{ env.VERSION }}
          
          # Copia arquivos do frontend
          docker cp webserver-frontend-temp:/usr/share/nginx/html/. /tmp/frontend-dist/
          
          # Remove container temporário
          docker rm webserver-frontend-temp
          
          # Verifica se os arquivos foram copiados corretamente
          echo "=== Arquivos copiados ==="
          ls -la /tmp/frontend-dist/
          
          # Verifica se index.html existe
          if [ ! -f "/tmp/frontend-dist/index.html" ]; then
            echo "ERROR: index.html não encontrado!"
            exit 1
          fi

      - name: 🚀 Run containers
        run: |
          # Backend primeiro
          docker run -dti --restart always \
            --name webserver-backend \
            --network proxy \
            -p 5000:5000 \
            vsantosmt/portfolio-backend:${{ env.VERSION }}

          # Nginx com os arquivos estáticos do frontend
          docker run -dti --restart always \
            --name webserver-nginx \
            --network proxy \
            -v /tmp/frontend-dist:/usr/share/nginx/html:ro \
            -p 80:80 -p 443:443 \
            vsantosmt/portfolio-nginx:${{ env.VERSION }}

          # Aguarda nginx inicializar
          sleep 5

          # Testa se nginx está funcionando
          echo "=== Testando nginx internamente ==="
          docker exec webserver-nginx ls -la /usr/share/nginx/html/
          docker exec webserver-nginx cat /usr/share/nginx/html/index.html | head -10
          
          echo "=== Testando conectividade ==="
          docker exec webserver-nginx wget -q -O - http://localhost/ | head -10 || echo "Falha no teste interno"

      - name: 🔍 Debug final
        run: |
          chmod +x script/debug_nginx.sh
          ./script/debug_nginx.sh

  # 🧹 Cleanup old images
  cleanup_images:
    runs-on: [self-hosted, Linux, X64]
    needs: execute_container
    steps:
      - uses: actions/checkout@v4
      - name: 🧼 Cleanup Images
        run: |
          chmod +x script/cleanup_images.sh
          ./script/cleanup_images.sh
