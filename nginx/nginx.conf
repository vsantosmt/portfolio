events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Configurações gerais
    sendfile on;
    keepalive_timeout 65;

    # Configuração de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    server {
        listen 80;
        server_name vgsenterprise.lat www.vgsenterprise.lat _;

        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # 🔹 FRONTEND (SPA) - Servir arquivos estáticos diretamente
        root /usr/share/nginx/html;
        index index.html;

        # Configuração principal para SPA
        location / {
            try_files $uri $uri/ @fallback;
        }

        # Fallback para SPA (React/Vue/Angular)
        location @fallback {
            rewrite ^.*$ /index.html last;
        }

        # Cache para assets estáticos
        location ~* \.(css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 🔹 BACKEND (API)
        location /api/ {
            proxy_pass http://webserver-backend:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}